[project]
name = "observatorio-cfem"
version = "0.1.0"
description = "Scripts de laboratório e teste do Observatório CFEM / RI Carajás (não é o produto)."
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts/testes"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
