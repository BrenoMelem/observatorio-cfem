[project]
name = "observatorio-cfem"
version = "0.1.0"
description = "Scripts de laboratório e teste do Observatório CFEM / RI Carajás (não é o produto)."
requires-python = ">=3.12"
dependencies = [
    "certifi>=2026.10.23",
    "httpx>=0.27",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["scripts/testes"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
# O notebook é gerado por scripts/notebook/construir_notebook.py, que é o arquivo conferido.
extend-exclude = ["scripts/notebook/*.ipynb"]

[tool.ruff.lint.per-file-ignores]
# As sondas registram qualquer falha da fonte como evidência, em vez de interromper (laboratório).
"scripts/sondas/*.py" = ["BLE001"]
