[project]
name = "observatorio-cfem-backend"
version = "0.1.0"
description = "Camada publicada do Observatório CFEM"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
