# Coleta, confere e publica os preços de ferro e cobre do Pink Sheet do World Bank (RN-FNT-05; ADR-011; pacote como Release, ADR-015).
# Agenda (RN-TMP-02, decisão de 27/11/2026): uma tentativa por dia nos dias 4 a 10 de cada mês, porque a edição sai no
# começo do mês sem dia fixo. Só publica quando o SHA-256 das planilhas mudou (salvo com "forcar"). No dia 10, se
# ainda não houve Release fonte-pinksheet-* do mês, abre ou comenta uma issue. Parte do pacote parcial anterior do
# próprio Pink Sheet (fonte-pinksheet-*).
# Lote aprovado: Release fonte-pinksheet-* com o pacote parcial, o relatório de qualidade e as planilhas brutas
# (RN-TMP-18); depois chama publicar-pacote.yml (workflow_call), que monta o pacote. Falha abre uma issue, ou comenta
# na aberta. Guia: docs/guias/pipeline-pinksheet.md.
name: Coletar Pink Sheet

on:
  schedule:
    - cron: "0 7 4-10 * *" # dias 4 a 10 de cada mês, 07:00 UTC, depois da SICONFI (dia 5, 06:30)
  workflow_dispatch:
    inputs:
      forcar:
        description: "Coletar e publicar mesmo se as planilhas não mudaram"
        type: boolean
        default: false

permissions:
  contents: write # cria a Release do pacote
  issues: write # abre ou comenta a issue de falha

concurrency:
  group: coletar-pinksheet
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      publicar: ${{ steps.release.outputs.publicar }}
    env:
      GH_TOKEN: ${{ github.token }}
      FORCAR: ${{ inputs.forcar }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Instalar o backend
        run: uv sync --project backend --frozen --no-dev --extra coleta

      - name: Baixar o pacote parcial anterior do Pink Sheet
        id: base
        run: |
          BASE=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("fonte-pinksheet-"))][0].tagName // empty')
          echo "Pacote parcial de partida: ${BASE:-nenhum}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          {
            echo "OBS_DATA_DIR=$RUNNER_TEMP/dados"
            echo "OBS_PUBLICADO_DIR=$RUNNER_TEMP/dados/publicado"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dados/publicado"
          if [ -n "$BASE" ]; then
            gh release download "$BASE" --pattern publicado.tar.gz --dir "$RUNNER_TEMP"
            tar -xzf "$RUNNER_TEMP/publicado.tar.gz" -C "$RUNNER_TEMP/dados/publicado"
          fi

      - name: Coletar, conferir e publicar
        id: coleta
        run: |
          set -o pipefail
          OPCAO="--somente-se-mudou"
          if [ "$FORCAR" = "true" ]; then OPCAO=""; fi
          set +e
          uv run --project backend --no-dev --extra coleta python -m observatorio.coleta pinksheet $OPCAO > "$RUNNER_TEMP/resumo.json"
          SAIDA=$?
          set -e
          cat "$RUNNER_TEMP/resumo.json"
          echo "situacao=$(jq -r .situacao "$RUNNER_TEMP/resumo.json")" >> "$GITHUB_OUTPUT"
          exit $SAIDA

      - name: Guardar o relatório de qualidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualidade-pinksheet
          path: ${{ runner.temp }}/dados/qualidade/
          if-no-files-found: ignore

      - name: Publicar o pacote parcial numa Release
        id: release
        if: steps.coleta.outputs.situacao == 'aprovado'
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          cd "$RUNNER_TEMP"
          VERSAO=$(jq -r .versao_pacote resumo.json)
          RELATORIO=$(jq -r .relatorio resumo.json)
          BRUTO=$(jq -r .bruto resumo.json)
          TAG="fonte-pinksheet-$(date -u +%Y-%m-%d-%H%M)"
          tar -czf publicado.tar.gz -C "$OBS_PUBLICADO_DIR" .
          tar -czf pinksheet-bruto.tar.gz -C "$BRUTO" .
          cp "$RELATORIO" qualidade-pinksheet.json
          {
            echo "Pacote parcial com os preços de ferro e cobre do Pink Sheet, aprovado na validação (RN-VPU-01)."
            echo
            echo "- Pacote parcial de partida: ${BASE:-nenhum}"
            echo "- Versão do pacote: \`$VERSAO\`"
            echo "- Conferência (anos por indicador): $(jq -c .conferencia resumo.json)"
            echo "- Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "pinksheet-bruto.tar.gz guarda as planilhas mensal e anual da edição, com o endereço e o SHA-256 de cada uma em indice.json."
            echo "Só o Pink Sheet; a API serve o pacote montado por publicar-pacote.yml (docs/guias/pipeline-pinksheet.md)."
          } > notas.md
          gh release create "$TAG" publicado.tar.gz qualidade-pinksheet.json pinksheet-bruto.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Pacote parcial do Pink Sheet de $TAG" --notes-file notas.md
          echo "publicar=true" >> "$GITHUB_OUTPUT"

      - name: Alertar se a edição do mês não saiu até o dia 10
        if: steps.coleta.outputs.situacao == 'sem_mudanca' && github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" != "10" ]; then exit 0; fi
          MES=$(date -u +%Y-%m)
          DO_MES=$(gh release list --limit 100 --json tagName --jq "[.[] | select(.tagName | startswith(\"fonte-pinksheet-$MES-\"))] | length")
          if [ "$DO_MES" != "0" ]; then exit 0; fi
          TITULO="Pink Sheet: edição de $MES não apareceu"
          echo "As tentativas dos dias 4 a 10 não encontraram edição nova do Pink Sheet; a publicação anterior segue valendo (RN-VPU-03). Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$RUNNER_TEMP/aviso.md"
          ABERTA=$(gh issue list --state open --search "in:title \"$TITULO\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITULO\")][0].number // empty")
          if [ -n "$ABERTA" ]; then
            gh issue comment "$ABERTA" --body-file "$RUNNER_TEMP/aviso.md"
          else
            gh issue create --title "$TITULO" --body-file "$RUNNER_TEMP/aviso.md"
          fi

      - name: Abrir ou comentar a issue de falha
        if: failure()
        run: |
          TITULO="Coleta do Pink Sheet falhou"
          {
            echo "A coleta agendada do Pink Sheet falhou; a publicação anterior foi preservada (RN-VPU-03)."
            echo
            echo "- Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            RELATORIO=$(jq -r '.relatorio // empty' "$RUNNER_TEMP/resumo.json" 2>/dev/null)
            if [ -n "$RELATORIO" ] && [ -f "$RELATORIO" ]; then
              echo "- Situação: $(jq -r .situacao "$RELATORIO")"
              echo
              echo "Erros do relatório de qualidade (o relatório completo está no artefato qualidade-pinksheet):"
              echo
              jq -r '(.erros // [])[] | "- " + .' "$RELATORIO" | head -n 30
            else
              echo
              echo "A falha ocorreu antes do relatório de qualidade; veja os passos da execução."
            fi
          } > "$RUNNER_TEMP/issue.md"
          ABERTA=$(gh issue list --state open --search "in:title \"$TITULO\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITULO\")][0].number // empty")
          if [ -n "$ABERTA" ]; then
            gh issue comment "$ABERTA" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITULO" --body-file "$RUNNER_TEMP/issue.md"
          fi

  publicar:
    needs: coletar
    if: needs.coletar.outputs.publicar == 'true'
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/publicar-pacote.yml
