# Coleta, confere e publica a despesa por função do SICONFI (RN-FNT-04; ADR-011; pacote como Release, ADR-015).
# Agenda mensal (RN-TMP-02, exceção de 25/11/2026): consulta o extrato de entregas e só coleta quando uma
# entrega da DCA, do RREO do 6º bimestre ou da MSC de dezembro aparece ou muda (retificação, RN-TMP-04), salvo
# com "forcar". Parte do pacote publicado mais recente de qualquer fonte (pacote-*), para não perder a CFEM.
# Lote aprovado: Release pacote-siconfi-* com o pacote, o relatório de qualidade e o bruto da API (RN-TMP-18,
# exceção de 25/11/2026). Falha abre uma issue, ou comenta na aberta. Guia: docs/guias/pipeline-siconfi.md.
name: Coletar SICONFI

on:
  schedule:
    - cron: "30 6 5 * *" # dia 5 de cada mês, 06:30 UTC, depois da coleta diária da CFEM
  workflow_dispatch:
    inputs:
      forcar:
        description: "Coletar mesmo se o extrato de entregas não mudou"
        type: boolean
        default: false

permissions:
  contents: write # cria a Release do pacote
  issues: write # abre ou comenta a issue de falha

concurrency:
  group: publicar-pacote # o mesmo da CFEM: uma publicação por vez sobre o mesmo pacote
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      FORCAR: ${{ inputs.forcar }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Instalar o backend
        run: uv sync --project backend --frozen --no-dev

      - name: Baixar o pacote publicado mais recente
        id: base
        run: |
          BASE=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("pacote-"))][0].tagName // empty')
          echo "Pacote de partida: ${BASE:-nenhum}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          {
            echo "OBS_DATA_DIR=$RUNNER_TEMP/dados"
            echo "OBS_PUBLICADO_DIR=$RUNNER_TEMP/dados/publicado"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dados/publicado"
          if [ -n "$BASE" ]; then
            gh release download "$BASE" --pattern publicado.tar.gz --dir "$RUNNER_TEMP"
            tar -xzf "$RUNNER_TEMP/publicado.tar.gz" -C "$RUNNER_TEMP/dados/publicado"
          fi

      - name: Coletar, conferir e publicar
        id: coleta
        run: |
          set -o pipefail
          OPCAO="--somente-se-mudou"
          if [ "$FORCAR" = "true" ]; then OPCAO=""; fi
          set +e
          uv run --project backend --no-dev python -m observatorio.coleta siconfi $OPCAO > "$RUNNER_TEMP/resumo.json"
          SAIDA=$?
          set -e
          cat "$RUNNER_TEMP/resumo.json"
          echo "situacao=$(jq -r .situacao "$RUNNER_TEMP/resumo.json")" >> "$GITHUB_OUTPUT"
          exit $SAIDA

      - name: Guardar o relatório de qualidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualidade-siconfi
          path: ${{ runner.temp }}/dados/qualidade/
          if-no-files-found: ignore

      - name: Publicar o pacote numa Release
        if: steps.coleta.outputs.situacao == 'aprovado'
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          cd "$RUNNER_TEMP"
          VERSAO=$(jq -r .versao_pacote resumo.json)
          RELATORIO=$(jq -r .relatorio resumo.json)
          BRUTO=$(jq -r .bruto resumo.json)
          TAG="pacote-siconfi-$(date -u +%Y-%m-%d-%H%M)"
          tar -czf publicado.tar.gz -C "$OBS_PUBLICADO_DIR" .
          tar -czf siconfi-bruto.tar.gz -C "$BRUTO" .
          cp "$RELATORIO" qualidade-siconfi.json
          {
            echo "Pacote publicado com a despesa por função do SICONFI, aprovado na validação (RN-VPU-01)."
            echo
            echo "- Pacote de partida: ${BASE:-nenhum}"
            echo "- Versão do pacote: \`$VERSAO\`"
            echo "- Conferência (município-exercício por estágio): $(jq -c .conferencia resumo.json)"
            echo "- Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "siconfi-bruto.tar.gz guarda as respostas da API usadas, com o SHA-256 de cada uma em indice.json."
            echo "Para servir: extraia publicado.tar.gz na pasta de OBS_PUBLICADO_DIR (docs/guias/pipeline-siconfi.md)."
          } > notas.md
          gh release create "$TAG" publicado.tar.gz qualidade-siconfi.json siconfi-bruto.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Pacote SICONFI de $TAG" --notes-file notas.md

      - name: Abrir ou comentar a issue de falha
        if: failure()
        run: |
          TITULO="Coleta do SICONFI falhou"
          {
            echo "A coleta agendada do SICONFI falhou; a publicação anterior foi preservada (RN-VPU-03)."
            echo
            echo "- Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            RELATORIO=$(jq -r '.relatorio // empty' "$RUNNER_TEMP/resumo.json" 2>/dev/null)
            if [ -n "$RELATORIO" ] && [ -f "$RELATORIO" ]; then
              echo "- Situação: $(jq -r .situacao "$RELATORIO")"
              echo
              echo "Erros do relatório de qualidade (o relatório completo está no artefato qualidade-siconfi):"
              echo
              jq -r '(.erros // [])[] | "- " + .' "$RELATORIO" | head -n 30
            else
              echo
              echo "A falha ocorreu antes do relatório de qualidade; veja os passos da execução."
            fi
          } > "$RUNNER_TEMP/issue.md"
          ABERTA=$(gh issue list --state open --search "in:title \"$TITULO\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITULO\")][0].number // empty")
          if [ -n "$ABERTA" ]; then
            gh issue comment "$ABERTA" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITULO" --body-file "$RUNNER_TEMP/issue.md"
          fi
