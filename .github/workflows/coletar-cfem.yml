# Coleta, valida e publica a arrecadação da CFEM (ADR-011; pacote como Release pelo ADR-015, nota de 19/11/2026).
# Lê o .csv.gz da Release anm-* mais recente, gravada por arquivar-anm.yml, e roda observatorio.coleta. Lote
# aprovado: o pacote publicado vai para uma Release pacote-cfem-*. Falha na coleta ou na validação abre uma
# issue, ou comenta na que já estiver aberta. Guia: docs/guias/pipeline-cfem.md.
#
# Agendado, e não disparado pela Release do arquivamento: eventos criados com o GITHUB_TOKEN não iniciam outros
# workflows. Só trabalha quando há edição nova da ANM sem pacote, salvo com "forcar".
name: Coletar CFEM

on:
  schedule:
    - cron: "30 5 * * *" # diário, 05:30 UTC, depois do arquivamento das 04:00 UTC
  workflow_dispatch:
    inputs:
      forcar:
        description: "Rodar mesmo se a edição mais recente da ANM já tiver pacote"
        type: boolean
        default: false

permissions:
  contents: write # cria a Release do pacote
  issues: write # abre ou comenta a issue de falha

concurrency:
  group: coletar-cfem
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      FORCAR: ${{ inputs.forcar }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Instalar o backend
        run: uv sync --project backend --frozen --no-dev

      - name: Escolher a edição da ANM
        id: edicao
        run: |
          ANM=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("anm-"))][0].tagName // empty')
          if [ -z "$ANM" ]; then echo "::error::Nenhuma Release anm-* encontrada"; exit 1; fi
          ANTERIOR=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("pacote-cfem-"))][0].tagName // empty')
          FEITO=false
          if [ -n "$ANTERIOR" ] && gh release view "$ANTERIOR" --json body --jq .body | grep -qF "Edição da ANM: $ANM"; then
            FEITO=true
          fi
          if [ "$FORCAR" = "true" ]; then FEITO=false; fi
          echo "Edição da ANM: $ANM; pacote anterior: ${ANTERIOR:-nenhum}; já processada: $FEITO"
          {
            echo "anm=$ANM"
            echo "anterior=$ANTERIOR"
            echo "feito=$FEITO"
          } >> "$GITHUB_OUTPUT"
          {
            echo "OBS_DATA_DIR=$RUNNER_TEMP/dados"
            echo "OBS_PUBLICADO_DIR=$RUNNER_TEMP/dados/publicado"
          } >> "$GITHUB_ENV"

      - name: Baixar o arquivo da ANM e o pacote anterior
        if: steps.edicao.outputs.feito != 'true'
        env:
          ANM: ${{ steps.edicao.outputs.anm }}
          ANTERIOR: ${{ steps.edicao.outputs.anterior }}
        run: |
          mkdir -p "$RUNNER_TEMP/anm" "$OBS_PUBLICADO_DIR"
          gh release download "$ANM" --pattern arrecadacao.csv.gz --dir "$RUNNER_TEMP/anm"
          # O pacote anterior entra na pasta publicada: a publicação confere que a série não encolheu (RN-VPU-02).
          if [ -n "$ANTERIOR" ]; then
            gh release download "$ANTERIOR" --pattern publicado.tar.gz --dir "$RUNNER_TEMP"
            tar -xzf "$RUNNER_TEMP/publicado.tar.gz" -C "$OBS_PUBLICADO_DIR"
          fi

      - name: Coletar, validar e publicar
        id: coleta
        if: steps.edicao.outputs.feito != 'true'
        env:
          ANM: ${{ steps.edicao.outputs.anm }}
        run: |
          set +e
          uv run --project backend --no-dev python -m observatorio.coleta cfem \
            --arquivo "$RUNNER_TEMP/anm/arrecadacao.csv.gz" \
            --origem "https://github.com/$GITHUB_REPOSITORY/releases/download/$ANM/arrecadacao.csv.gz" \
            --referencias data/referencia-cfem-mensal-anm.json \
            --referencias-nacionais data/referencia-cfem-nacional-anm.json \
            --evidencias data/evidencias-anm > "$RUNNER_TEMP/resumo.json"
          SAIDA=$?
          cat "$RUNNER_TEMP/resumo.json"
          exit $SAIDA

      - name: Guardar o relatório de qualidade
        if: always() && steps.edicao.outputs.feito != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: qualidade-cfem
          path: ${{ runner.temp }}/dados/qualidade/
          if-no-files-found: ignore

      - name: Publicar o pacote numa Release
        if: steps.edicao.outputs.feito != 'true'
        env:
          ANM: ${{ steps.edicao.outputs.anm }}
        run: |
          cd "$RUNNER_TEMP"
          VERSAO=$(jq -r .versao_pacote resumo.json)
          RELATORIO=$(jq -r .relatorio resumo.json)
          TAG="pacote-cfem-$(date -u +%Y-%m-%d-%H%M)"
          tar -czf publicado.tar.gz -C "$OBS_PUBLICADO_DIR" .
          cp "$RELATORIO" qualidade-cfem.json
          {
            echo "Pacote publicado da arrecadação da CFEM, aprovado na validação (RN-VPU-01)."
            echo
            echo "- Edição da ANM: $ANM"
            echo "- Versão do pacote: \`$VERSAO\`"
            echo "- Linhas lidas: $(jq -r .linhas resumo.json); repetições integrais no recorte: $(jq -r .duplicatas resumo.json)"
            echo "- Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Para servir: extraia publicado.tar.gz na pasta de OBS_PUBLICADO_DIR (docs/guias/pipeline-cfem.md)."
          } > notas.md
          gh release create "$TAG" publicado.tar.gz qualidade-cfem.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Pacote CFEM de $TAG" --notes-file notas.md

      - name: Abrir ou comentar a issue de falha
        if: failure()
        env:
          ANM: ${{ steps.edicao.outputs.anm }}
        run: |
          TITULO="Coleta da CFEM falhou"
          {
            echo "A coleta agendada da CFEM falhou; a publicação anterior foi preservada (RN-VPU-03)."
            echo
            echo "- Edição da ANM: ${ANM:-não identificada}"
            echo "- Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            RELATORIO=$(jq -r '.relatorio // empty' "$RUNNER_TEMP/resumo.json" 2>/dev/null)
            if [ -n "$RELATORIO" ] && [ -f "$RELATORIO" ]; then
              echo "- Situação: $(jq -r .situacao "$RELATORIO")"
              echo
              echo "Erros do relatório de qualidade (o relatório completo está no artefato qualidade-cfem):"
              echo
              jq -r '(.erros // [])[] | "- " + .' "$RELATORIO" | head -n 30
            else
              echo
              echo "A falha ocorreu antes do relatório de qualidade; veja os passos da execução."
            fi
          } > "$RUNNER_TEMP/issue.md"
          ABERTA=$(gh issue list --state open --search "in:title \"$TITULO\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITULO\")][0].number // empty")
          if [ -n "$ABERTA" ]; then
            gh issue comment "$ABERTA" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITULO" --body-file "$RUNNER_TEMP/issue.md"
          fi
