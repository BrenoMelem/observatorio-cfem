# Coleta e publica o PIB dos Municípios do IBGE pelo SIDRA, agregado 5938 (RN-FNT-02; ADR-011; pacote como Release, ADR-015).
# Agenda (RN-TMP-02, decisão do mantenedor de 27/11/2026): uma verificação por mês; o IBGE divulga uma edição por ano
# (em dezembro, com dois anos de defasagem), sem data fixa. Só publica quando as datas de modificação dos anos no
# SIDRA ou a resposta mudaram (salvo com "forcar"). Sem referência externa: o lote é homologado pelas conferências
# internas (exceção de RN-VPU-07 de 27/11/2026). Parte do pacote parcial anterior do próprio PIB (fonte-pib-*).
# Lote aprovado: Release fonte-pib-* com o pacote parcial, o relatório de qualidade e as respostas brutas do SIDRA
# (RN-TMP-18); depois chama publicar-pacote.yml (workflow_call), que monta o pacote. Falha abre uma issue, ou comenta
# na aberta. Guia: docs/guias/pipeline-pib.md.

name: Coletar PIB municipal

on:
  schedule:
    - cron: "30 7 15 * *" # dia 15 de cada mês, 07:30 UTC, longe da SICONFI (dia 5) e do Pink Sheet (dias 4 a 10)
  workflow_dispatch:
    inputs:
      forcar:
        description: "Coletar e publicar mesmo se o SIDRA não mudou"
        type: boolean
        default: false

permissions:
  contents: write # cria a Release do pacote
  issues: write # abre ou comenta a issue de falha

concurrency:
  group: coletar-pib
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publicar: ${{ steps.release.outputs.publicar }}
    env:
      GH_TOKEN: ${{ github.token }}
      FORCAR: ${{ inputs.forcar }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v7

      - name: Instalar o backend
        run: uv sync --project backend --frozen --no-dev

      - name: Baixar o pacote parcial anterior do PIB
        id: base
        run: |
          BASE=$(gh release list --limit 100 --json tagName --jq '[.[] | select(.tagName | startswith("fonte-pib-"))][0].tagName // empty')
          echo "Pacote parcial de partida: ${BASE:-nenhum}"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          {
            echo "OBS_DATA_DIR=$RUNNER_TEMP/dados"
            echo "OBS_PUBLICADO_DIR=$RUNNER_TEMP/dados/publicado"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/dados/publicado"
          if [ -n "$BASE" ]; then
            gh release download "$BASE" --pattern publicado.tar.gz --dir "$RUNNER_TEMP"
            tar -xzf "$RUNNER_TEMP/publicado.tar.gz" -C "$RUNNER_TEMP/dados/publicado"
          fi

      - name: Coletar, conferir e publicar
        id: coleta
        run: |
          set -o pipefail
          OPCAO="--somente-se-mudou"
          if [ "$FORCAR" = "true" ]; then OPCAO=""; fi
          set +e
          uv run --project backend --no-dev python -m observatorio.coleta pib $OPCAO > "$RUNNER_TEMP/resumo.json"
          SAIDA=$?
          set -e
          cat "$RUNNER_TEMP/resumo.json"
          echo "situacao=$(jq -r .situacao "$RUNNER_TEMP/resumo.json")" >> "$GITHUB_OUTPUT"
          exit $SAIDA

      - name: Guardar o relatório de qualidade
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qualidade-pib
          path: ${{ runner.temp }}/dados/qualidade/
          if-no-files-found: ignore

      - name: Publicar o pacote parcial numa Release
        id: release
        if: steps.coleta.outputs.situacao == 'aprovado'
        env:
          BASE: ${{ steps.base.outputs.base }}
        run: |
          cd "$RUNNER_TEMP"
          VERSAO=$(jq -r .versao_pacote resumo.json)
          RELATORIO=$(jq -r .relatorio resumo.json)
          BRUTO=$(jq -r .bruto resumo.json)
          TAG="fonte-pib-$(date -u +%Y-%m-%d-%H%M)"
          tar -czf publicado.tar.gz -C "$OBS_PUBLICADO_DIR" .
          tar -czf pib-bruto.tar.gz -C "$BRUTO" .
          cp "$RELATORIO" qualidade-pib.json
          {
            echo "Pacote parcial com o PIB, os impostos e o VAB dos municípios (SIDRA 5938), aprovado na validação (RN-VPU-01)."
            echo
            echo "- Pacote parcial de partida: ${BASE:-nenhum}"
            echo "- Versão do pacote: \`$VERSAO\`"
            echo "- Conferência (município e ano): $(jq -c .conferencia resumo.json)"
            echo "- Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "pib-bruto.tar.gz guarda as respostas do SIDRA (períodos e dados), com a URL e o SHA-256 de cada uma em indice.json."
            echo "Só o PIB; a API serve o pacote montado por publicar-pacote.yml (docs/guias/pipeline-pib.md)."
          } > notas.md
          gh release create "$TAG" publicado.tar.gz qualidade-pib.json pib-bruto.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false \
            --title "Pacote parcial do PIB municipal de $TAG" --notes-file notas.md
          echo "publicar=true" >> "$GITHUB_OUTPUT"

      - name: Abrir ou comentar a issue de falha
        if: failure()
        run: |
          TITULO="Coleta do PIB municipal falhou"
          {
            echo "A coleta agendada do PIB municipal falhou; a publicação anterior foi preservada (RN-VPU-03)."
            echo
            echo "- Execução: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            RELATORIO=$(jq -r '.relatorio // empty' "$RUNNER_TEMP/resumo.json" 2>/dev/null)
            if [ -n "$RELATORIO" ] && [ -f "$RELATORIO" ]; then
              echo "- Situação: $(jq -r .situacao "$RELATORIO")"
              echo
              echo "Erros do relatório de qualidade (o relatório completo está no artefato qualidade-pib):"
              echo
              jq -r '(.erros // [])[] | "- " + .' "$RELATORIO" | head -n 30
            else
              echo
              echo "A falha ocorreu antes do relatório de qualidade; veja os passos da execução."
            fi
          } > "$RUNNER_TEMP/issue.md"
          ABERTA=$(gh issue list --state open --search "in:title \"$TITULO\"" --json number,title \
            --jq "[.[] | select(.title == \"$TITULO\")][0].number // empty")
          if [ -n "$ABERTA" ]; then
            gh issue comment "$ABERTA" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$TITULO" --body-file "$RUNNER_TEMP/issue.md"
          fi

  publicar:
    needs: coletar
    if: needs.coletar.outputs.publicar == 'true'
    permissions:
      contents: write
      issues: write
    uses: ./.github/workflows/publicar-pacote.yml
