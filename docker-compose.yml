# Ambiente provisório (ADR-015): API e PostgreSQL na máquina de cada pessoa ou na máquina da universidade.
# Uso: cp backend/.env.example .env  (e ajuste as senhas); depois  docker compose up --build
services:
  api:
    build: ./backend
    ports:
      - "${OBS_API_PORTA:-8000}:8000" # porta do computador; a do contêiner é sempre 8000
    environment:
      OBS_PUBLICADO_DIR: /dados/publicado
      OBS_CORS_ORIGENS: ${OBS_CORS_ORIGENS:-} # origens da demo ou do front, separadas por vírgula
      DATABASE_URL: postgresql://${POSTGRES_USER:-observatorio}:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/${POSTGRES_DB:-observatorio}
    volumes:
      # O pacote publicado (observações e manifesto de indicadores) entra por volume, só leitura (ADR-014, ADR-015).
      - ${OBS_PUBLICADO_HOST:-./output/observatorio/publicado}:/dados/publicado:ro
    depends_on:
      - postgres

  postgres:
    # Dados enviados por usuários (ADR-016). Nenhum código usa o banco ainda.
    image: postgres:17.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-observatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-observatorio}
    volumes:
      - dados-postgres:/var/lib/postgresql/data

volumes:
  dados-postgres:
